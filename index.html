<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

       RELAY ORIGIN: https://dvd-relay.williamsdan94.workers.dev -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob: data: https://upload.wikimedia.org https://en.wikipedia.org https://image.tmdb.org; worker-src 'self' blob:; connect-src 'self' blob: data: https://en.wikipedia.org https://upload.wikimedia.org https://dvd-relay.williamsdan94.workers.dev https://image.tmdb.org; media-src 'self' blob: mediastream:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2A2A2C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My DVDs">
  <title>My DVDs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"><p class="loading">Loading…</p></main>

  <!-- Hidden camera picker for "Snap cover instead". -->

  <!-- Hidden file picker for importing a JSON backup. -->
  <input id="import-input" type="file" accept="application/json,.json" hidden>

  <script src="vendor/zxing-wasm-reader.js"></script>
  <script src="lookup.js"></script>
  <script src="scanner.js"></script>

</html>
